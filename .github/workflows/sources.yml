name: Sources

# Weekly: fetch the official sources, keep the snapshots on the `sources` branch, rebuild the
# data from them, and open a pull request when the data changed. The data in main only changes
# through a reviewed pull request.
on:
    schedule:
        - cron: '41 4 * * 1'
    workflow_dispatch:

concurrency:
    group: sources
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write
    issues: write

jobs:
    sources:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            - name: Check out the snapshots
              run: |
                  if git ls-remote --exit-code --heads origin sources >/dev/null; then
                    git fetch --depth=1 origin sources
                    git worktree add .sources FETCH_HEAD
                    git -C .sources switch -c sources
                  else
                    git worktree add --orphan -b sources .sources
                  fi

            - name: Fetch
              run: pnpm fetch:sources

            - name: Commit the snapshots
              run: |
                  cd .sources
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  git add -A
                  if git diff --cached --quiet; then
                    echo "No changes"
                  else
                    git commit -q -m "Snapshots of $(date -u +%F)"
                    git push origin sources
                  fi

            # Fails, and changes nothing, when a page can't be placed: that needs a person
            - name: Rebuild the data
              id: build
              run: |
                  set -o pipefail
                  pnpm build:data 2>&1 | tee build.log
                  pnpm generate
                  git diff --quiet -- data src/ids.generated.ts schema || echo "changed=true" >> "$GITHUB_OUTPUT"

            - name: Test the new data
              if: steps.build.outputs.changed == 'true'
              run: |
                  set -o pipefail
                  pnpm typecheck 2>&1 | tee test.log
                  pnpm test 2>&1 | tee -a test.log

            - name: Open or update the data pull request
              if: steps.build.outputs.changed == 'true' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  git switch -c data/sources
                  git add data src/ids.generated.ts schema
                  git commit -q -m "Update the data from the official sources ($(date -u +%F))"
                  git push -f origin data/sources
                  {
                    echo "The weekly fetch of the official sources changed the data: $RUN_URL"
                    echo
                    echo '```'
                    git diff --stat HEAD~1 -- data
                    echo '```'
                    echo
                    echo "What the parsers couldn't read:"
                    echo
                    echo '```'
                    grep '^unreadable' build.log | head -40 || true
                    echo '```'
                    echo
                    echo "Review the diff against the sources before merging. Pull requests opened"
                    echo "by this workflow don't start CI themselves: the workflow ran the typecheck"
                    echo "and tests above; close and reopen the pull request to run the full CI."
                  } > body.md
                  number=$(gh pr list --head data/sources --state open --json number --jq '.[0].number')
                  if [ -n "$number" ]; then
                    gh pr edit "$number" --body-file body.md
                  else
                    gh pr create --base main --head data/sources --title "Data update from the official sources" --body-file body.md --label data-update \
                      || gh issue create --title "Data update from the official sources is ready on branch data/sources" --body-file body.md
                  fi

            # A failed page, an interrupted walk or a page the parser can't place: nothing was
            # rebuilt, and a person needs to look
            - name: Open or update the sources issue
              if: failure() && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  body="The weekly sources run failed, so the data wasn't rebuilt: $RUN_URL. A source page may have failed (its last good snapshot is kept), or the parser met a page it can't place."
                  gh label create data-freshness --color FBCA04 --description "Data may be out of date" 2>/dev/null || true
                  number=$(gh issue list --label data-freshness --state open --json number --jq '.[0].number')
                  if [ -n "$number" ]; then
                    gh issue comment "$number" --body "$body"
                  else
                    gh issue create --title "Data freshness check needs attention" --label data-freshness --body "$body"
                  fi
