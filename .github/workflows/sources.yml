name: Sources

# Weekly: fetch the official sources, keep the snapshots on the `sources` branch, rebuild the
# data from them, and open a pull request when the data changed. The data is never changed
# without a reviewed pull request.
on:
    schedule:
        - cron: '41 4 * * 1'
    workflow_dispatch:
    # TEMPORARY while the fetchers are developed on this branch; removed before merging
    push:
        branches: [data-model-v2]
        paths: [scripts/sources/**, .github/workflows/sources.yml]

concurrency:
    group: sources
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    fetch:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Check out the snapshots
              run: |
                  if git ls-remote --exit-code --heads origin sources >/dev/null; then
                    git fetch --depth=1 origin sources
                    git worktree add .sources FETCH_HEAD
                    git -C .sources switch -c sources
                  else
                    git worktree add --orphan -b sources .sources
                  fi

            - name: Fetch
              run: node scripts/sources/fetch.ts

            - name: Commit the snapshots
              run: |
                  cd .sources
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  git add -A
                  if git diff --cached --quiet; then
                    echo "No changes"
                  else
                    git commit -q -m "Snapshots of $(date -u +%F)"
                    git push origin sources
                  fi
