name: Prepare release

# Run it from the Actions tab: it raises the version, moves the Unreleased section of
# CHANGELOG.md under it (scripts/prepare-release.ts) and opens the release pull request. Merging
# that pull request publishes the release (release.yml). The changelog stays hand-written: add
# to Unreleased as changes land.
on:
    workflow_dispatch:
        inputs:
            bump:
                description: 'Version to raise, by the id rules in CHANGELOG.md'
                type: choice
                options: [patch, minor, major]
                required: true

permissions: {}

concurrency:
    group: prepare-release
    cancel-in-progress: false

jobs:
    prepare:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
            - name: Raise the version
              id: version
              env:
                  BUMP: ${{ inputs.bump }}
              run: echo "version=$(node scripts/prepare-release.ts "$BUMP")" >> "$GITHUB_OUTPUT"
            # A token from the repository's GitHub App when it's set up (the BOT_CLIENT_ID variable
            # and the BOT_PRIVATE_KEY secret): a pull request it opens or pushes to starts CI, which
            # one from the workflow's own token doesn't. Without the app, the workflow's token is used.
            - name: Get the bot's token
              id: bot
              if: vars.BOT_CLIENT_ID != ''
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ vars.BOT_CLIENT_ID }}
                  private-key: ${{ secrets.BOT_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
            - name: Open the release pull request
              env:
                  GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
                  BOT: ${{ steps.bot.outcome == 'success' }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  git switch -c "release/v$VERSION"
                  git commit -q -am "Release $VERSION"
                  git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "release/v$VERSION"
                  {
                    echo "Moves the Unreleased changes under $VERSION. Merging this pull request publishes"
                    echo "$VERSION to npm and PyPI and creates the GitHub release."
                    if [ "$BOT" != true ]; then
                      echo
                      echo "Pull requests opened with the workflow's own token don't start CI: close and"
                      echo "reopen this one to run it, or set up the bot (docs/guide/contributing.md)."
                    fi
                  } > body.md
                  gh pr create --base main --head "release/v$VERSION" --title "Release $VERSION" --body-file body.md
