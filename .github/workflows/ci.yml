name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Generate, typecheck, lint + format, build, tests with coverage, publint + attw, and
            # the generated files committed
            - run: pnpm check
            - run: pnpm docs:build
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: package
                  path: |
                      dist
                      data
                      schema
                      datapackage.json
                      package.json
                      test/smoke
                  retention-days: 3

    # The package claims Node >=22.12: load the built files with import and require() on every
    # supported version
    node-compat:
        needs: check
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ['22.12', 22, 24, 26]
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: package
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ matrix.node }}
            # The runtime dependencies only, from the registry, as a consumer installs them
            - run: npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund
            - run: node test/smoke/esm.mjs
            - run: node test/smoke/cjs.cjs

    # Security lint for the workflows: template injection, token permissions, unpinned actions,
    # credentials left in .git/config, ...
    zizmor:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # Prints the findings and fails the job, rather than uploading them to code scanning,
            # so it also works on pull requests from forks
            - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
              with:
                  advanced-security: false

    # A pull request that adds or upgrades to a dependency with a known vulnerability fails here
    dependency-review:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
              with:
                  fail-on-severity: moderate
