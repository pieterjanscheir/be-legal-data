name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Generate, typecheck, lint + format, build, tests with coverage, publint + attw, and
            # the generated files committed
            - run: pnpm check
            - run: pnpm docs:build
            - uses: actions/upload-artifact@v7
              with:
                  name: package
                  path: |
                      dist
                      data
                      schema
                      datapackage.json
                      package.json
                      test/smoke
                  retention-days: 3

    # The package claims Node >=22.12: load the built files with import and require() on every
    # supported version
    node-compat:
        needs: check
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ['22.12', 22, 24, 26]
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: package
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
            - run: node test/smoke/esm.mjs
            - run: node test/smoke/cjs.cjs
