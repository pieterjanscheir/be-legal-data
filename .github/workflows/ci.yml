name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Generate, typecheck, lint + format, build, tests with coverage, publint + attw, and
            # the generated files committed
            - run: pnpm check
            - run: pnpm docs:build
            - uses: actions/upload-artifact@v7
              with:
                  name: package
                  path: |
                      dist
                      data
                      schema
                      datapackage.json
                      package.json
                      test/smoke
                  retention-days: 3

    # The package claims Node >=22.12: load the built files with import and require() on every
    # supported version
    node-compat:
        needs: check
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ['22.12', 22, 24, 26]
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: package
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
            # The runtime dependencies only, from the registry, as a consumer installs them
            - run: npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund
            - run: node test/smoke/esm.mjs
            - run: node test/smoke/cjs.cjs

    # The Python package: lint, types, and the same answers as the TypeScript helpers, on every
    # supported Python
    python:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python: ['3.11', '3.12', '3.13', '3.14']
        defaults:
            run:
                working-directory: python
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
              working-directory: .
            - run: pnpm build && pnpm build:cases
              working-directory: .
            - uses: astral-sh/setup-uv@v7
              with:
                  python-version: ${{ matrix.python }}
            - run: uv sync --locked
            - run: uv run ruff format --check .
            - run: uv run ruff check .
            - run: uv run mypy
            - run: uv run pytest
            - run: uv build
