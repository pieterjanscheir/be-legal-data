name: Release

# Publishes to npm and PyPI when a version tag is pushed. Uses trusted publishing (OIDC) on both,
# so no token is stored: link this workflow to the package under its settings on npmjs.com, and
# add it as a trusted publisher on pypi.org (workflow release.yml, environment pypi).
on:
    push:
        tags: ['v*']

permissions:
    # write: create the GitHub release
    contents: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org
            - run: pnpm install --frozen-lockfile
            - name: Check the tag matches package.json
              run: |
                  version=$(node -p "require('./package.json').version")
                  if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                      echo "Tag $GITHUB_REF_NAME doesn't match version $version"
                      exit 1
                  fi
            # prepublishOnly runs pnpm check. A version that's already on npm (published by hand,
            # or a rerun) is skipped, so the GitHub release below still gets made.
            - name: Publish to npm
              run: |
                  spec="$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}"
                  if npm view "$spec" version > /dev/null 2>&1; then
                      echo "$spec is already on npm; not publishing it again"
                  else
                      npm publish --provenance --access public
                  fi
            - name: Create the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              # The data as JSON and CSV, with the schemas and the data package descriptor, for
              # people who don't use npm
              run: |
                  pnpm build:csv
                  name="belgica-data-$GITHUB_REF_NAME"
                  mkdir "$name"
                  cp -r data schema datapackage.json LICENSE-DATA csv "$name"/
                  zip -qr "$name.zip" "$name"
                  gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "$name.zip"

    pypi:
        needs: publish
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v7
            - name: Check the tag matches pyproject.toml
              run: |
                  version=$(uv version --short --project python)
                  if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                      echo "Tag $GITHUB_REF_NAME doesn't match version $version in python/pyproject.toml"
                      exit 1
                  fi
            # The build copies data/ in. The npm job has run pnpm check on the same commit, and
            # CI the Python tests.
            - run: uv build
              working-directory: python
            # skip-existing: a rerun doesn't fail on a version that's already on PyPI
            - uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: python/dist
                  skip-existing: true
