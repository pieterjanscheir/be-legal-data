name: Release

# Publishes to npm when a version tag is pushed. Uses npm trusted publishing (OIDC), so no
# token is stored: link this workflow to the package under its settings on npmjs.com.
on:
    push:
        tags: ['v*']

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org
            - run: pnpm install --frozen-lockfile
            - name: Check the tag matches package.json
              run: |
                  version=$(node -p "require('./package.json').version")
                  if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                      echo "Tag $GITHUB_REF_NAME doesn't match version $version"
                      exit 1
                  fi
            # prepublishOnly runs pnpm check
            - run: npm publish --provenance --access public
