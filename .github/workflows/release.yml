name: Release

# Publishes to npm when a version tag is pushed. Uses npm trusted publishing (OIDC), so no
# token is stored: link this workflow to the package under its settings on npmjs.com.
on:
    push:
        tags: ['v*']

permissions:
    # write: create the GitHub release
    contents: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org
            - run: pnpm install --frozen-lockfile
            - name: Check the tag matches package.json
              run: |
                  version=$(node -p "require('./package.json').version")
                  if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                      echo "Tag $GITHUB_REF_NAME doesn't match version $version"
                      exit 1
                  fi
            # prepublishOnly runs pnpm check
            - run: npm publish --provenance --access public
            - name: Create the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              # The data as JSON and CSV, with the schemas and the data package descriptor, for
              # people who don't use npm
              run: |
                  pnpm build:csv
                  name="be-legal-data-data-$GITHUB_REF_NAME"
                  mkdir "$name"
                  cp -r data schema datapackage.json LICENSE-DATA csv "$name"/
                  zip -qr "$name.zip" "$name"
                  gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "$name.zip"
