# Temporary: checks whether GitHub-hosted runners can reach the official sources.
# Fetched pages are committed back to this branch so they can be inspected.
name: Spike - source reachability
on:
    push:
        branches: [spike/source-reachability]
        paths: [spike/crawl.ts, .github/workflows/spike-sources.yml]
permissions:
    contents: write
jobs:
    probe:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Crawl the sources
              run: node spike/crawl.ts
            - name: Commit results
              run: |
                  git config user.name github-actions
                  git config user.email github-actions@users.noreply.github.com
                  git add spike/sources
                  git commit -m "Spike results [skip ci]"
                  git push
