name: Docs

# Builds the VitePress site in docs/ and the Next.js explorer in site/, and deploys them to GitHub
# Pages together, the explorer under /explore/. Needs Settings → Pages → Source set to "GitHub
# Actions".
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions: {}

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # lastUpdated reads the git history
                  fetch-depth: 0
                  persist-credentials: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # The getting-started page measures each entry point from the build
            - run: pnpm build
            - run: pnpm docs:build
            - run: pnpm site:build
              env:
                  SITE_BASE: /belgica/explore
            - run: cp -R site/out docs/.vitepress/dist/explore
            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: docs/.vitepress/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
