# Gemini Code Assist on GitHub: https://docs.cloud.google.com/gemini/docs/code-review/customize-repo-review
have_fun: false
# Generated files, and data rebuilt by the parsers: review the code that makes them instead
ignore_patterns:
    - 'src/*.generated.ts'
    - 'schema/**'
    - 'data/**'
    - 'ids.lock.json'
    - 'test/fixtures/**'
    - 'pnpm-lock.yaml'
code_review:
    disable: false
    comment_severity_threshold: MEDIUM
    max_review_comments: -1
    pull_request_opened:
        help: false
        # CodeRabbit writes the summary
        summary: false
        code_review: true
        include_drafts: false
