<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- A lowercase b drawn in data cells on an ink tile, with one yellow and one red cell -->
    <defs>
        <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2c3150" />
            <stop offset="1" stop-color="#121420" />
        </linearGradient>
    </defs>
    <rect width="32" height="32" rx="7.5" fill="url(#tile)" />
    <g fill="#fff">
        <rect x="6.8" y="3.5" width="5.2" height="5.2" rx="1.3" />
        <rect x="6.8" y="10.1" width="5.2" height="5.2" rx="1.3" />
        <rect x="6.8" y="16.7" width="5.2" height="5.2" rx="1.3" />
        <rect x="6.8" y="23.3" width="5.2" height="5.2" rx="1.3" />
        <rect x="13.4" y="10.1" width="5.2" height="5.2" rx="1.3" />
        <rect x="20.0" y="16.7" width="5.2" height="5.2" rx="1.3" />
        <rect x="13.4" y="23.3" width="5.2" height="5.2" rx="1.3" />
    </g>
    <rect x="20.0" y="10.1" width="5.2" height="5.2" rx="1.3" fill="#fdda24" />
    <rect x="20.0" y="23.3" width="5.2" height="5.2" rx="1.3" fill="#ef3340" />
</svg>
